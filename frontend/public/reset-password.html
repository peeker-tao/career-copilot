<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 - Career Copilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f7; color: #1a1a2e;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 40px;
      max-width: 420px; width: 90%; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .card h1 { font-size: 22px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e5e7eb;
      border-top-color: #7c3aed; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ef4444; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="spinner"></div>
    <h1>正在跳转...</h1>
    <p>请稍候，正在引导至重置密码页面</p>
  </div>
  <script>location.href = '/reset-password' + location.search;</script>
</body>
</html>
