<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重置密码 - Career Copilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }
    h1 {
      font-size: 24px;
      color: #1f2937;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }
    input[type="email"]:focus,
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #667eea;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
    }
    .btn-send-code {
      padding: 12px 16px;
      background: #e5e7eb;
      color: #374151;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-send-code:hover { background: #d1d5db; }
    .btn-send-code:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-send-code.sent {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #2563eb;
    }
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      margin-top: 8px;
      background: #e5e7eb;
      overflow: hidden;
      transition: all 0.3s;
    }
    .strength-bar-inner {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: all 0.3s;
    }
    .strength-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .message.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .match-hint { font-size: 12px; margin-top: 4px; }
    .match-hint.ok { color: #059669; }
    .match-hint.fail { color: #dc2626; }
    .step-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .step {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      position: relative;
    }
    .step.active { color: #667eea; font-weight: 600; }
    .step.done { color: #10b981; }
    .step::after {
      content: '';
      display: block;
      height: 2px;
      background: #e5e7eb;
      margin-top: 4px;
    }
    .step.active::after { background: #667eea; }
    .step.done::after { background: #10b981; }
    .step:last-child::after { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>重置密码</h1>
    <p class="subtitle">通过邮箱验证码重置您的密码</p>

    <div class="form-group">
      <label for="email">注册邮箱</label>
      <input type="email" id="email" placeholder="请输入注册时使用的邮箱" autocomplete="email" />
    </div>

    <div class="form-group">
      <label for="code">验证码</label>
      <div class="input-row">
        <input type="text" id="code" placeholder="请输入 6 位验证码" maxlength="6" autocomplete="one-time-code" />
        <button class="btn-send-code" id="sendCodeBtn">发送验证码</button>
      </div>
    </div>

    <div class="form-group">
      <label for="newPassword">新密码</label>
      <input type="password" id="newPassword" placeholder="至少 6 位" autocomplete="new-password" />
      <div class="strength-bar"><div class="strength-bar-inner" id="strengthBar"></div></div>
      <div class="strength-text" id="strengthText"></div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">确认密码</label>
      <input type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password" />
      <div class="match-hint" id="matchHint"></div>
    </div>

    <button class="btn-primary" id="submitBtn" disabled>重置密码</button>

    <div class="message" id="message"></div>
  </div>

  <script>
    const API_BASE = '{{RESET_PASSWORD_API_URL}}';

    // DOM 元素
    const emailEl = document.getElementById('email');
    const codeEl = document.getElementById('code');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const newPwd = document.getElementById('newPassword');
    const confirmPwd = document.getElementById('confirmPassword');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');
    const matchHint = document.getElementById('matchHint');
    const submitBtn = document.getElementById('submitBtn');
    const msgEl = document.getElementById('message');

    let countdownTimer = null;
    let countdownSec = 0;

    // ==================== 发送验证码 ====================
    sendCodeBtn.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msgEl.className = 'message error';
        msgEl.textContent = '❌ 请输入有效的邮箱地址';
        msgEl.style.display = 'block';
        return;
      }

      sendCodeBtn.disabled = true;
      sendCodeBtn.textContent = '发送中...';

      try {
        const res = await fetch(`${API_BASE}/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (res.ok) {
          msgEl.className = 'message success';
          msgEl.textContent = '✅ 验证码已发送，请查看您的邮箱';
          msgEl.style.display = 'block';
          startCountdown(60);
        } else {
          msgEl.className = 'message error';
          msgEl.textContent = `❌ ${data.message || data.error || '发送失败'}`;
          msgEl.style.display = 'block';
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '发送验证码';
        }
      } catch (err) {
        msgEl.className = 'message error';
        msgEl.textContent = `❌ 网络错误：${err.message}`;
        msgEl.style.display = 'block';
        sendCodeBtn.disabled = false;
        sendCodeBtn.textContent = '发送验证码';
      }
    });

    function startCountdown(sec) {
      countdownSec = sec;
      sendCodeBtn.textContent = `${sec}秒后重试`;
      sendCodeBtn.className = 'btn-send-code sent';
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        countdownSec--;
        if (countdownSec <= 0) {
          clearInterval(countdownTimer);
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '重新发送';
          sendCodeBtn.className = 'btn-send-code';
        } else {
          sendCodeBtn.textContent = `${countdownSec}秒后重试`;
        }
      }, 1000);
    }

    // ==================== 密码强度检测 ====================
    function calcStrength(pwd) {
      let score = 0;
      if (pwd.length >= 6) score += 20;
      if (pwd.length >= 10) score += 10;
      if (/[a-z]/.test(pwd)) score += 15;
      if (/[A-Z]/.test(pwd)) score += 15;
      if (/[0-9]/.test(pwd)) score += 15;
      if (/[^a-zA-Z0-9]/.test(pwd)) score += 25;
      return Math.min(score, 100);
    }

    function updateStrength() {
      const score = calcStrength(newPwd.value);
      strengthBar.style.width = score + '%';
      if (score < 30) {
        strengthBar.style.background = '#ef4444';
        strengthText.textContent = '强度：弱';
      } else if (score < 60) {
        strengthBar.style.background = '#f59e0b';
        strengthText.textContent = '强度：中';
      } else {
        strengthBar.style.background = '#10b981';
        strengthText.textContent = '强度：强';
      }
    }

    function updateMatch() {
      if (!confirmPwd.value) {
        matchHint.textContent = '';
        matchHint.className = 'match-hint';
        return;
      }
      const match = newPwd.value === confirmPwd.value;
      matchHint.textContent = match ? '✓ 密码一致' : '✗ 密码不一致';
      matchHint.className = 'match-hint ' + (match ? 'ok' : 'fail');
    }

    function validateForm() {
      const valid =
        emailEl.value.trim() &&
        codeEl.value.trim().length === 6 &&
        newPwd.value.length >= 6 &&
        newPwd.value === confirmPwd.value;
      submitBtn.disabled = !valid;
    }

    emailEl.addEventListener('input', validateForm);
    codeEl.addEventListener('input', validateForm);
    newPwd.addEventListener('input', () => { updateStrength(); validateForm(); });
    confirmPwd.addEventListener('input', () => { updateMatch(); validateForm(); });

    // ==================== 提交重置 ====================
    submitBtn.addEventListener('click', async () => {
      if (submitBtn.disabled) return;

      submitBtn.disabled = true;
      submitBtn.textContent = '重置中...';
      msgEl.className = 'message';
      msgEl.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailEl.value.trim(),
            code: codeEl.value.trim(),
            newPassword: newPwd.value,
          }),
        });

        const data = await res.json();

        if (res.ok) {
          msgEl.className = 'message success';
          msgEl.textContent = '✅ 密码重置成功！请前往登录。';
          msgEl.style.display = 'block';
          submitBtn.textContent = '已完成';
        } else {
          msgEl.className = 'message error';
          msgEl.textContent = `❌ ${data.message || data.error || '重置失败'}`;
          msgEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = '重置密码';
        }
      } catch (err) {
        msgEl.className = 'message error';
        msgEl.textContent = `❌ 网络错误：${err.message}。请确保后端服务已启动。`;
        msgEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '重置密码';
      }
    });
  </script>
</body>
</html>
